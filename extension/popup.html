<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Agent Firewall</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
    }

    .header {
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid rgba(255, 255, 255, 0.2);
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .shield-icon {
      font-size: 24px;
    }

    .subtitle {
      font-size: 12px;
      opacity: 0.9;
      font-weight: 400;
    }

    .status-section {
      padding: 20px;
      background: rgba(255, 255, 255, 0.1);
    }

    .status-card {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 12px;
      backdrop-filter: blur(10px);
    }

    .status-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.8;
      margin-bottom: 5px;
    }

    .status-value {
      font-size: 20px;
      font-weight: 700;
    }

    .status-value.safe {
      color: #4ade80;
    }

    .risk-score {
      font-size: 36px;
      font-weight: 700;
      color: #4ade80;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
    }

    .stat-item {
      background: rgba(255, 255, 255, 0.1);
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }

    .stat-number {
      font-size: 22px;
      font-weight: 700;
      display: block;
      margin-bottom: 3px;
    }

    .stat-label {
      font-size: 10px;
      opacity: 0.8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .footer {
      padding: 15px 20px;
      text-align: center;
      background: rgba(0, 0, 0, 0.2);
    }

    .btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }

    .status-badge {
      display: inline-block;
      background: #4ade80;
      color: #065f46;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      margin-top: 5px;
    }

    .info-text {
      font-size: 11px;
      opacity: 0.7;
      margin-top: 10px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>
      <span class="shield-icon">🛡️</span>
      Agent Firewall
    </h1>
    <p class="subtitle">Secure Agentic Browser Protection</p>
  </div>

  <div class="status-section">
    <div class="status-card">
      <div class="status-label">Current Page Risk Score</div>
      <div class="risk-score">0</div>
      <div class="status-badge">✓ SAFE</div>
    </div>

    <div class="status-card">
      <div class="status-label">Protection Status</div>
      <div class="status-value safe">ACTIVE</div>
      <p class="info-text">All agent actions are being monitored and validated</p>
    </div>

    <div class="stats">
      <div class="stat-item">
        <span class="stat-number">0</span>
        <span class="stat-label">Threats Blocked</span>
      </div>
      <div class="stat-item">
        <span class="stat-number">0</span>
        <span class="stat-label">Pages Scanned</span>
      </div>
    </div>
  </div>

  <div class="footer">
    <button class="btn">View Dashboard</button>
  </div>
</body>
</html>
