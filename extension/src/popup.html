<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Run Agent</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 12px; width: 340px; }
      .row { display: flex; gap: 8px; }
      input[type="text"] { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 8px; }
      button { padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; }
      button.primary { background: #111827; color: #fff; border-color: #111827; }
      .muted { color: #6b7280; font-size: 12px; margin-top: 8px; }
      pre { margin-top: 10px; padding: 8px; background: #0b1020; color: #e5e7eb; border-radius: 8px; max-height: 220px; overflow: auto; font-size: 11px; }
      .status { margin-top: 8px; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="row">
      <input id="task" type="text" placeholder="What should the agent do on this tab?" />
      <button id="run" class="primary">Run</button>
    </div>
    <div class="status" id="status"></div>
    <div class="muted">Uses local agent API at <code>http://127.0.0.1:8000</code>. The agent attaches to the active tab via CDP.</div>
    <pre id="log"></pre>
    <script src="popup.js"></script>
  </body>
</html>
