<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Agent Dashboard</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 0; background: #0b0b0b; color: #fff; }
    header { padding: 14px 16px; border-bottom: 1px solid #222; background: #050505; display:flex; align-items:center; justify-content:space-between; gap:10px; }
    header h1 { font-size: 14px; margin: 0; }
    header .meta { font-size: 12px; color: #aaa; text-align:right; }
    main { padding: 14px 16px; display: grid; gap: 12px; max-width: 980px; margin: 0 auto; }
    .row { display:flex; gap:10px; align-items:center; }
    input[type=text] { flex:1; padding: 10px 12px; border: 1px solid #333; background: #111; color: #fff; }
    button { padding: 10px 12px; border: 1px solid #444; background: #151515; color: #fff; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: default; }
    .status { padding: 10px 12px; border: 1px solid #222; background:#0f0f0f; color: #ffb24a; font-weight: 700; }
    pre { margin: 0; padding: 12px; white-space: pre-wrap; word-break: break-word; max-height: 60vh; overflow: auto; background: #000; border: 1px solid #222; }
    .hint { font-size: 12px; color: #bbb; }
  </style>
</head>
<body>
  <header>
    <h1>Secure Agentic Browser — Dashboard</h1>
    <div class="meta" id="tabMeta">No active tab</div>
  </header>

  <main>
    <div class="row">
      <input id="task" type="text" placeholder="Enter objective…" />
      <button id="run">Run on active tab</button>
      <button id="stop">Stop</button>
    </div>

    <div class="hint">Live actions happen in the Chrome tab. This dashboard shows status/results.</div>

    <div class="status" id="status">Idle</div>
    <pre id="log">—</pre>
  </main>

  <script src="dashboard.js"></script>
</body>
</html>
