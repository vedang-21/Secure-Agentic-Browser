<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Panel</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 0; background: #0b0b0b; color: #fff; }
    header { padding: 12px 14px; border-bottom: 1px solid #222; background: #050505; }
    header h1 { font-size: 14px; margin: 0 0 6px; }
    header .meta { font-size: 12px; color: #aaa; }
    .controls { padding: 12px 14px; display: grid; gap: 10px; }
    input[type=text] { width: 100%; padding: 10px 12px; border: 1px solid #333; background: #111; color: #fff; }
    button { padding: 10px 12px; border: 1px solid #444; background: #151515; color: #fff; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: default; }
    .status { padding: 10px 14px; border-top: 1px solid #222; color: #ffb24a; font-weight: 600; }
    pre { margin: 0; padding: 12px 14px; white-space: pre-wrap; word-break: break-word; max-height: 55vh; overflow: auto; background: #000; border-top: 1px solid #222; }
    .small { font-size: 12px; color: #bbb; }
  </style>
</head>
<body>
  <header>
    <h1>Secure Agentic Browser</h1>
    <div class="meta" id="tabMeta">No tab</div>
  </header>

  <div class="controls">
    <input id="task" type="text" placeholder="Enter objective…" />
    <button id="run">Run on active tab</button>
    <button id="stop">Stop</button>
    <div class="small">Results/logs appear here; actions happen in the active Chrome tab.</div>
  </div>

  <div class="status" id="status">Idle</div>
  <pre id="log">—</pre>

  <script src="sidepanel.js"></script>
</body>
</html>
